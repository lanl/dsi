<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSI Data Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f5f7fa;
        }

        /* Main Layout */
        .explorer-container {
            display: flex;
            height: 100vh;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .top-bar h1 {
            font-size: 1.4em;
            font-weight: 600;
        }

        .top-bar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .workspace-input {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            width: 300px;
            font-size: 0.9em;
        }

        .btn-load {
            background: white;
            color: #667eea;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-load:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Content Area */
        .content-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Sidebar - Databases & Tables */
        .left-sidebar {
            width: 280px;
            min-width: 280px;
            flex-shrink: 0;
            background: white;
            border-right: 1px solid #e1e8ed;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e1e8ed;
            font-weight: 600;
            color: #333;
            background: #f8f9fa;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        /* Database Tree */
        .cluster-group {
            margin-bottom: 16px;
        }

        .cluster-header {
            padding: 8px 12px;
            background: #f0f2ff;
            border-radius: 6px;
            font-weight: 600;
            color: #667eea;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
        }

        .cluster-header:hover {
            background: #e0e5ff;
        }

        .cluster-count {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .database-list {
            margin-top: 8px;
            padding-left: 8px;
        }

        .database-item {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .database-item:hover {
            background: #f8f9fa;
            border-left-color: #667eea;
        }

        .database-item.active {
            background: #f0f2ff;
            border-left-color: #667eea;
            font-weight: 600;
        }

        .database-name {
            font-size: 0.9em;
            color: #333;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .database-meta {
            font-size: 0.75em;
            color: #666;
            margin-top: 2px;
        }

        .table-list {
            margin-top: 8px;
            padding-left: 20px;
            display: none;
        }

        .table-list.show {
            display: block;
        }

        .table-item {
            padding: 6px 12px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-item:hover {
            background: #f0f2ff;
        }

        .table-item.active {
            background: #e0e5ff;
            font-weight: 600;
        }

        .table-rows {
            font-size: 0.8em;
            color: #999;
        }

        /* Middle Panel - Operations */
        .middle-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #fafbfc;
            overflow: hidden;
        }

        .operation-header {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #e1e8ed;
        }

        .operation-tabs {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .operation-tab {
            padding: 8px 16px;
            border: none;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            color: #666;
        }

        .operation-tab.active {
            background: #667eea;
            color: white;
        }

        .operation-tab:hover:not(.active) {
            background: #e1e8ed;
        }

        .operation-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .query-editor {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            padding: 20px;
        }

        .query-editor h3 {
            margin-bottom: 12px;
            color: #333;
        }

        .query-input {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .query-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .query-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #e1e8ed;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d8dd;
        }

        .templates {
            margin-top: 16px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .template-btn {
            padding: 6px 12px;
            border: 1px solid #e1e8ed;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.2s;
        }

        .template-btn:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }

        /* Results Panel */
        .results-panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-top: 20px;
            overflow: hidden;
        }

        .results-header {
            padding: 16px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-header h3 {
            color: #333;
            font-size: 1.1em;
        }

        .results-stats {
            font-size: 0.9em;
            color: #666;
        }

        .results-content {
            max-height: 500px;
            overflow: auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;
        }

        .results-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
        }

        .results-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e1e8ed;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .results-table tr:hover {
            background: #f8f9fa;
        }

        .no-data {
            padding: 40px;
            text-align: center;
            color: #999;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        .input-simple {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
            transition: border-color 0.2s;
        }

        .input-simple:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="explorer-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <h1>🔍 DSI Data Explorer</h1>
            <div class="top-bar-actions">
                <input type="text" id="workspace-path" class="workspace-input"
                       placeholder="Enter workspace folder path..."
                       value="./federated_data">
                <button class="btn-load" onclick="loadWorkspace()">
                    📂 Load Workspace
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Left Sidebar -->
            <div class="left-sidebar">
                <div class="sidebar-header">
                    📁 Databases & Tables
                </div>
                <div class="sidebar-content" id="database-tree">
                    <div class="no-data">
                        Load a workspace to see databases
                    </div>
                </div>
            </div>

            <!-- Middle Panel -->
            <div class="middle-panel">
                <div class="operation-header">
                    <h2 style="color: #333;">Operations</h2>
                    <div class="operation-tabs">
                        <button class="operation-tab active" onclick="switchOperation('query')" id="tab-query">
                            📝 SQL Query
                        </button>
                        <button class="operation-tab" onclick="switchOperation('get_table')" id="tab-get_table">
                            📋 Get Table
                        </button>
                        <button class="operation-tab" onclick="switchOperation('find')" id="tab-find">
                            🔍 Find
                        </button>
                        <button class="operation-tab" onclick="switchOperation('search')" id="tab-search">
                            🔎 Search
                        </button>
                    </div>
                </div>

                <div class="operation-content">
                    <div id="operation-alert"></div>

                    <!-- SQL Query -->
                    <div id="op-query" class="query-editor">
                        <h3>SQL Query</h3>
                        <textarea id="query-input" class="query-input"
                                  placeholder="SELECT * FROM table_name LIMIT 10;"></textarea>
                        <div class="templates">
                            <button class="template-btn" onclick="setTemplate('SELECT * FROM [TABLE] LIMIT 10;')">
                                Preview Table
                            </button>
                            <button class="template-btn" onclick="setTemplate('SELECT COUNT(*) FROM [TABLE];')">
                                Count Rows
                            </button>
                            <button class="template-btn" onclick="setTemplate('SELECT * FROM [TABLE] WHERE [CONDITION];')">
                                Filter
                            </button>
                            <button class="template-btn" onclick="setTemplate('SELECT [COLUMN], COUNT(*) as count FROM [TABLE] GROUP BY [COLUMN];')">
                                Group By
                            </button>
                        </div>
                        <div class="query-actions">
                            <button class="btn btn-primary" onclick="executeOperation()">
                                ▶️ Execute Query
                            </button>
                            <button class="btn btn-secondary" onclick="clearResults()">
                                🗑️ Clear
                            </button>
                        </div>
                    </div>

                    <!-- Get Table -->
                    <div id="op-get_table" class="query-editor hidden">
                        <h3>Get Full Table</h3>
                        <p style="color: #666; margin-bottom: 12px;">Enter table name to retrieve all data:</p>
                        <input type="text" id="get-table-input" class="input-simple"
                               placeholder="table_name">
                        <div class="query-actions">
                            <button class="btn btn-primary" onclick="executeOperation()">
                                📋 Get Table
                            </button>
                            <button class="btn btn-secondary" onclick="clearResults()">
                                🗑️ Clear
                            </button>
                        </div>
                    </div>

                    <!-- Find -->
                    <div id="op-find" class="query-editor hidden">
                        <h3>Find Rows by Condition</h3>
                        <p style="color: #666; margin-bottom: 12px;">Format: column operator value</p>
                        <input type="text" id="find-input" class="input-simple"
                               placeholder="age > 25">
                        <div class="templates">
                            <button class="template-btn" onclick="setFindTemplate('column > value')">
                                Greater Than
                            </button>
                            <button class="template-btn" onclick="setFindTemplate('column = value')">
                                Equal
                            </button>
                            <button class="template-btn" onclick="setFindTemplate('column ~ value')">
                                Contains
                            </button>
                            <button class="template-btn" onclick="setFindTemplate('column (min, max)')">
                                Range
                            </button>
                        </div>
                        <div class="query-actions">
                            <button class="btn btn-primary" onclick="executeOperation()">
                                🔍 Find
                            </button>
                            <button class="btn btn-secondary" onclick="clearResults()">
                                🗑️ Clear
                            </button>
                        </div>
                    </div>

                    <!-- Search -->
                    <div id="op-search" class="query-editor hidden">
                        <h3>Search Across All Tables</h3>
                        <p style="color: #666; margin-bottom: 12px;">Enter value to search for:</p>
                        <input type="text" id="search-input" class="input-simple"
                               placeholder="search_value">
                        <div class="query-actions">
                            <button class="btn btn-primary" onclick="executeOperation()">
                                🔎 Search
                            </button>
                            <button class="btn btn-secondary" onclick="clearResults()">
                                🗑️ Clear
                            </button>
                        </div>
                    </div>

                    <!-- Results Panel -->
                    <div id="results-panel" class="results-panel hidden">
                        <div class="results-header">
                            <h3>Results</h3>
                            <div class="results-stats" id="results-stats"></div>
                        </div>
                        <div class="results-content" id="results-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentWorkspace = null;
        let currentDatabase = null;
        let currentOperation = 'query';
        let databases = [];

        // Load workspace
        async function loadWorkspace() {
            const workspacePath = document.getElementById('workspace-path').value;
            if (!workspacePath) {
                alert('Please enter a workspace path');
                return;
            }

            try {
                const response = await fetch('/api/load-workspace', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workspace_path: workspacePath })
                });

                const data = await response.json();

                if (data.success) {
                    currentWorkspace = data.workspace;
                    databases = data.databases;
                    displayDatabaseTree(data.databases_by_cluster);
                    showAlert('success', `Loaded ${data.count} database(s) from workspace`);
                } else {
                    showAlert('error', data.message);
                }
            } catch (error) {
                showAlert('error', `Error: ${error.message}`);
            }
        }

        // Display database tree
        function displayDatabaseTree(databases_by_cluster) {
            const tree = document.getElementById('database-tree');
            let html = '';

            for (const [cluster, dbs] of Object.entries(databases_by_cluster)) {
                html += `
                <div class="cluster-group">
                    <div class="cluster-header">
                        <span>📦 ${cluster}</span>
                        <span class="cluster-count">${dbs.length}</span>
                    </div>
                    <div class="database-list">`;

                dbs.forEach((db, idx) => {
                    const dbId = `db-${cluster}-${idx}`;
                    const dbPath = `${db.local_path}/${db.name}`;
                    html += `
                    <div class="database-item" id="${dbId}" onclick="selectDatabase('${dbId}', '${dbPath}', '${db.name}')">
                        <div class="database-name">
                            🗄️ ${db.name}
                        </div>
                        <div class="database-meta">${db.original_location}</div>
                        <div class="table-list" id="${dbId}-tables"></div>
                    </div>`;
                });

                html += '</div></div>';
            }

            tree.innerHTML = html;
        }

        // Select database and load tables
        async function selectDatabase(dbId, dbPath, dbName) {
            // Update active state
            document.querySelectorAll('.database-item').forEach(el => el.classList.remove('active'));
            document.getElementById(dbId).classList.add('active');

            currentDatabase = { id: dbId, path: dbPath, name: dbName };

            // Load table structure
            try {
                const response = await fetch('/api/get-database-structure', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ database_path: dbPath })
                });

                const data = await response.json();

                if (data.success) {
                    displayTables(dbId, data.tables);
                    showAlert('success', `Loaded ${data.tables.length} table(s) from ${dbName}`);
                } else {
                    showAlert('error', data.message);
                }
            } catch (error) {
                showAlert('error', `Error loading tables: ${error.message}`);
            }
        }

        // Display tables for a database
        function displayTables(dbId, tables) {
            const tableList = document.getElementById(`${dbId}-tables`);
            let html = '';

            tables.forEach((table, idx) => {
                const tableId = `${dbId}-table-${idx}`;
                html += `
                <div class="table-item" id="${tableId}"
                     onclick="selectTable('${tableId}', '${table.name}')">
                    <span>📊 ${table.name}</span>
                    <span class="table-rows">${table.row_count !== null ? table.row_count.toLocaleString() + ' rows' : ''}</span>
                </div>`;
            });

            tableList.innerHTML = html;
            tableList.classList.add('show');
        }

        // Select table
        function selectTable(tableId, tableName) {
            document.querySelectorAll('.table-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tableId).classList.add('active');

            // Auto-fill query based on current operation
            if (currentOperation === 'query') {
                document.getElementById('query-input').value = `SELECT * FROM ${tableName} LIMIT 10;`;
            } else if (currentOperation === 'get_table') {
                document.getElementById('get-table-input').value = tableName;
            }
        }

        // Switch operation
        function switchOperation(operation) {
            currentOperation = operation;

            // Update tabs
            document.querySelectorAll('.operation-tab').forEach(tab => tab.classList.remove('active'));
            document.getElementById(`tab-${operation}`).classList.add('active');

            // Show/hide operation panels
            ['query', 'get_table', 'find', 'search'].forEach(op => {
                document.getElementById(`op-${op}`).classList.toggle('hidden', op !== operation);
            });
        }

        // Execute operation
        async function executeOperation() {
            if (!currentDatabase) {
                alert('Please select a database first');
                return;
            }

            let queryParam = '';
            switch(currentOperation) {
                case 'query':
                    queryParam = document.getElementById('query-input').value.trim();
                    break;
                case 'get_table':
                    queryParam = document.getElementById('get-table-input').value.trim();
                    break;
                case 'find':
                    queryParam = document.getElementById('find-input').value.trim();
                    break;
                case 'search':
                    queryParam = document.getElementById('search-input').value.trim();
                    break;
            }

            if (!queryParam) {
                alert('Please enter a query parameter');
                return;
            }

            // Show loading
            const resultsPanel = document.getElementById('results-panel');
            const resultsContent = document.getElementById('results-content');
            resultsPanel.classList.remove('hidden');
            resultsContent.innerHTML = '<div class="spinner"></div>';

            try {
                const response = await fetch('/api/execute-operation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        database_path: currentDatabase.path,
                        operation: currentOperation,
                        query_param: queryParam
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data);
                } else {
                    resultsContent.innerHTML = `
                    <div class="alert alert-error" style="margin: 20px;">
                        <strong>✗ Error:</strong> ${data.message}
                    </div>`;
                }
            } catch (error) {
                resultsContent.innerHTML = `
                <div class="alert alert-error" style="margin: 20px;">
                    <strong>✗ Error:</strong> ${error.message}
                </div>`;
            }
        }

        // Display results
        function displayResults(data) {
            const resultsStats = document.getElementById('results-stats');
            const resultsContent = document.getElementById('results-content');

            resultsStats.textContent = `${data.row_count.toLocaleString()} rows • ${data.execution_time}s`;

            if (data.row_count === 0) {
                resultsContent.innerHTML = '<div class="no-data">No results found</div>';
                return;
            }

            let html = '<table class="results-table"><thead><tr>';
            data.columns.forEach(col => {
                html += `<th>${col}</th>`;
            });
            html += '</tr></thead><tbody>';

            data.rows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    const cellValue = cell === null ? '<em style="color: #999;">NULL</em>' : String(cell);
                    html += `<td>${cellValue}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';

            if (data.truncated) {
                html += `<div class="alert alert-info" style="margin: 16px;">
                    ⚠️ Results limited to 1000 rows
                </div>`;
            }

            resultsContent.innerHTML = html;
        }

        // Clear results
        function clearResults() {
            document.getElementById('results-panel').classList.add('hidden');
            document.getElementById('results-content').innerHTML = '';
        }

        // Show alert
        function showAlert(type, message) {
            const alert = document.getElementById('operation-alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // Template helpers
        function setTemplate(template) {
            document.getElementById('query-input').value = template;
        }

        function setFindTemplate(template) {
            document.getElementById('find-input').value = template;
        }
    </script>
</body>
</html>
